# Local development services only. Not intended for production use.
name: interview-reviewer

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ir
      POSTGRES_PASSWORD: ir
      POSTGRES_DB: interview_reviewer
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ir -d interview_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  llm:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434" # OpenAI-compatible API at /v1
    volumes:
      - llm-models:/root/.ollama

volumes:
  db-data:
  llm-models:

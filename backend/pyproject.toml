[project]
name = "interview-reviewer-backend"
version = "0.1.0"
description = "Interview Reviewer backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pypdf>=5.0",
    "langdetect>=1.0.9",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--junitxml=reports/junit.xml"
